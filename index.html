<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Wallpaper Gallery</title>
<style>
:root{--bg:#111;--card:#1a1a1a;--text:#eaeaea;--accent:#0066ff}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:var(--bg);color:var(--text)}
.grid{display:grid;gap:12px;padding:12px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.card{border-radius:8px;overflow:hidden;background:var(--card)}img{width:100%;height:180px;object-fit:cover;display:block;background:#111}
.meta{padding:6px 8px;font-size:0.85em}
.search{width:100%;padding:6px 12px;margin:12px 0;border:1px solid #333;background:#222;color:#fff;font-size:1em}
.filters button{padding:4px 10px;margin:2px 4px 2px 0;border:none;border-radius:4px;background:#333;color:#fff;cursor:pointer}
.filters button:hover{background:#444}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,0.9);display:none;align-items:center;justify-content:center}z-light{z-index:9999;padding:20px;max-width:90vh;max-height:90vh}button.close{position:absolute;top:12px;right:12px;background:none;border:none;color:#fff;font-size:2em;cursor:pointer}
</style></head><body>

const colors = data.reduce((a,d)=>{(d.color||'').split(',').forEach(c=>{if(!a[c])a[c]=[];a[c].push(d)};return a}),{});
const colorsSorted = Object.keys(colors).sort((a,b)=>colors[b].length-colors[a].length);

function renderGrid(filter='all'){
  const kw = document.getElementById('search').value.toLowerCase();
  const colorSel = document.querySelector('#filters .active')?.dataset.color||'all';
  const items = data.filter(d=>{
    const matchColor = colorSel==='all'||(colorSel&&d.color===colorSel);
    const matchKW = d.keywords.some(k=>k.toLowerCase().includes(kw));
    const matchName = d.name.toLowerCase().includes(kw);
    return matchColor && (matchKW||matchName);
  });
  const grid = document.getElementById('grid');
  grid.innerHTML = items.map(d=>`
    <div class="card" onclick="openLightbox('${d.full}')">
      <img src="${d.thumb}" loading="lazy" alt="${d.name}">
      <div class="meta">${d.name}</div>
    </div>`).join('');
  document.querySelectorAll('#filters button').forEach(b=>b.classList.remove('active'));
  if(colorSel!=='all')document.querySelector(`#filters button[data-color="${colorSel}"]`.classList.add('active');
}

function openLightbox(url){ document.getElementById('lightbox').style.display='flex'; document.getElementById('lightbox-img').src=url; }
function closeLightbox(){ document.getElementById('lightbox').style.display='none'; }

// init
renderGrid();
document.getElementById('search').addEventListener('input',()=>renderGrid());
document.getElementById('filters').innerHTML = '<button data-all class="active">Todos</button>' +
  colorsSorted.map(c=>`<button data-color="${c}">${c} <span class="count">${colors[c].length}</span></button>`).join('');

document.querySelectorAll('#filters button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('#filters button').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  renderGrid();
}));
</script>
